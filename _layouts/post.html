<!DOCTYPE html>
<html lang="{{ site.lang | default: site.language | default: 'en' }}" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="shortcut icon" href="{{ '/assets/favicon.ico' | relative_url }}" type="image/x-icon">
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicon.png'  | relative_url }}">
  <link href='{{ "/feed.xml" | relative_url }}' rel='alternate' type='application/atom+xml'>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <style>
    .post-meta {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    
    .post-tags {
      display: flex;
      gap: 0.5rem;
    }
    
    .post-tags a {
      text-decoration: none;
    }
    
    .back-link {
      text-align: center;
      margin-top: 2rem;
    }
  </style>
</head>

<body>
  <main>
    {% include header.html %}
    <article>
      <h1>{{ page.title }}</h1>
      <div class="post-meta">
        <time>{{ page.date | date: "%b %d, %Y" }}</time>
        {% if page.tags %}
        <div class="post-tags">
          {% for tag in page.tags %}
          {% assign tag_obj = site.my_tags | where_exp: 'item', 'item.slug == tag' | first %}
          <a href="{{ '/tagged/' | append: tag | relative_url }}"># {{ tag_obj.title }}</a>
          {% endfor %}
        </div>
        {% endif %}
      </div>
      {{ content }}
    </article>
    <p class="back-link"><a href="/">← Back to all writings</a></p>
  </main>
</body>

</html>
