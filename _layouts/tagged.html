<!DOCTYPE html>
<html lang="{{ site.lang | default: site.language | default: 'en' }}" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="shortcut icon" href="{{ '/assets/favicon.ico' | relative_url }}" type="image/x-icon">
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicon.png'  | relative_url }}">
  <link href='{{ "/feed.xml" | relative_url }}' rel='alternate' type='application/atom+xml'>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <style>
    .writings-list {
      list-style: none;
      padding: 0;
    }

    .writings-list li {
      margin-bottom: 0.5rem;
    }

    .writings-list a {
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main>
    {% include header.html %}
    <h1>{{ page.title }}</h1>

    <ul class="writings-list">
    {% assign sorted_writings = site.writings | sort: 'date' | reverse %}
    {% for writing in sorted_writings %}
      {% if writing.tags contains page.slug %}
      <li><span>{{ writing.date | date: "%Y-%m-%d" }}</span> <a href="{{ writing.url }}">{{ writing.title }}</a></li>
      {% endif %}
    {% endfor %}
    </ul>
  </main>
</body>

</html>
