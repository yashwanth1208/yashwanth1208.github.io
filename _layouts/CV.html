<!DOCTYPE html>
<html lang="{{ site.lang | default: site.language | default: 'en' }}" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="shortcut icon" href="{{ '/assets/favicon.png' | relative_url }}" type="image/x-icon">
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicon.png'  | relative_url }}">
  <link href='{{ "/feed.xml" | relative_url }}' rel='alternate' type='application/atom+xml'>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <style>
    .CV-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px;
    }
    
    .CV-container h1 {
      text-align: center;
      margin-bottom: 0;
    }
    
    .CV-container h1 + p {
      text-align: center;
      margin-top: 0.5rem;
      margin-bottom: 1.5rem;
    }
    
    /* Work Experience and Education sections */
    .CV-container h2 {
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }
    
    /* Company/Institution name */
    .CV-container h3 {
      margin-bottom: 0;
      margin-top: 0.8rem;
    }
    
    /* Job title with date on right */
    .CV-container h3 + p {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 0.2rem 0 0.8rem 0;
      gap: 1rem;
      flex-wrap: wrap;
    }
    
    .CV-container h3 + p strong {
      flex: 1 1 auto;
      min-width: 0;
    }
    
    .CV-container h3 + p em {
      white-space: nowrap;
      flex: 0 0 auto;
      margin-left: auto;
    }
    
    /* Tech stack only - no flex */
    .CV-container h3 + p em:only-child {
      display: inline;
      margin-left: 0;
    }
    
    /* List items under jobs */
    .CV-container ul {
      margin: 0.3rem 0 0.8rem 0;
      padding-left: 1.5rem;
    }
    
    .CV-container li {
      margin: 0.2rem 0;
      line-height: 1.4;
    }
    
    /* Education institution with year on right */
    #education + p {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 0.3rem 0 0.3rem 0;
      gap: 1rem;
    }
    
    #education + p em {
      white-space: nowrap;
      flex-shrink: 0;
    }
    
    /* Degree and CGPA - only push the strong CGPA to right */
    #education + p + p {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 0.2rem 0 0.5rem 0;
      gap: 1rem;
      flex-wrap: wrap;
    }
    
    #education + p + p strong:last-child {
      margin-left: auto;
    }
  </style>
</head>

<body>
  <main>
    {% include header.html %}
    <div class="CV-container">
      {{ content }}
    </div>
  </main>
</body>

</html>
